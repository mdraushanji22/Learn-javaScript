<!doctype html>
<html lang="en">
  <head>
    <title>Objects in JS</title>
  </head>
  <body>
    <h1>Objecs - JavaScript</h1>
    <script>
      let person = {
        fName: "Raushan",
        lName: "Jilani",
        age: 26,
        "item-name": "Banana",
        fullName: function () {
          return this.fName + " " + this.lName;
        },
        getAge: function () {
          return this.age;
        },
      };
      console.log(`FullName: ${person.fullName()}`);
      console.log(`Your age is: ${person.age}`);
      let myAge = person.getAge();
      console.log(`My age is: ${myAge}`);
      console.log(person);
      console.log(person.fName);
      person.fName = "Md Raushan Jilani";
      console.log(person);
      console.log(person["item-name"]);

      delete person["item-name"];
      console.log(person);

      person.city = "Delhi";
      console.log(person);
    </script>
  </body>
</html>
