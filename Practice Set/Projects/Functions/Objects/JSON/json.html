    <title>JSON</title>

  <body>
    <h1>JSON IN JavaScript</h1>
    <script>
      let Product = {
        name: "T-Shirt",
        price: 799,
        rating: {
          stars: 4.5,
          review: "Excellent",
        },
      };
      localStorage.setItem("Product", JSON.stringify(Product));
      localStorage.setItem("Name", "Raushan");
      let getData = JSON.parse(localStorage.getItem("Product"));
      console.log(getData);
      console.log(localStorage.getItem("Name"));
