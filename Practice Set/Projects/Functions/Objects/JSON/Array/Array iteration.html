<!doctype html>
<html>
  <body>
    <h1>JavaScript Arrays</h1>
    <h2>The for ... of Loop</h2>
    <p>for ... of iterates (loops) over the values of an array.</p>

    <p id="demo"></p>

    <script>
      // Create an Array
      const cars = ["BMW", "Volvo", "Mini"];

      // Iterate over the Array valuesLoop over
      let text = "";
      for (let x of cars) {
        text += x + "<br>";
      }

      document.getElementById("demo").innerHTML = text;
    </script>
  </body>
</html>
