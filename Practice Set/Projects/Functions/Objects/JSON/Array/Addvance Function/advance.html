<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <h1>Advance function in JavaScript</h1>
    <script>
      let sum = function (num1, num2) {
        return num1 + num2;
      };
      let newSum = sum(4, 6);
      console.log(newSum);
      console.log(sum(5, 9));
      console.log(sum(9, 9));
    </script>
  </body>
</html>
